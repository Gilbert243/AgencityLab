tau:
  estimation:
    method: autocorrelation    # autocorrelation | crm | manual
    threshold: 0.5
    min_tau: 1e-6

  scaling:
    enabled: true
    adaptive: true

  multiscale:
    enabled: true
    type: logspace
    min: 0.5
    max: 2.5
    n: 12

  dynamics:
    smoothing: false
    stability_check: true