# ============================================================
# AGENCITY MODEL CONFIGURATION
# ============================================================

model:

  # ----------------------------------------------------------
  # CORE THEORY
  # ----------------------------------------------------------
  core:
    formulation: canonical   # canonical | extended | experimental

    beta_definition:
      type: structured       # structured = J * U
      include_orientation: true
      include_contrast: true

    contrast:
      formula: log_ratio     # log((e + D)/(e + S))
      epsilon: 1e-12

    orientation:
      complex: true
      normalize: true

  # ----------------------------------------------------------
  # INTENSITIES
  # ----------------------------------------------------------
  intensities:
    dynamic:
      formula: euclidean     # sqrt(X^2 + (A X)^2)
      include_activity: true

    structural:
      formula: euclidean     # sqrt(M^2 + O^2)

  # ----------------------------------------------------------
  # MEMORY & ORGANIZATION
  # ----------------------------------------------------------
  memory:
    method: exponential
    causal: true

  organization:
    method: correlation
    normalized: true

  # ----------------------------------------------------------
  # TIME & SCALING
  # ----------------------------------------------------------
  time:
    reduced_time: true
    scaling:
      enabled: true
      tau_reference: auto

  # ----------------------------------------------------------
  # MULTISCALE THEORY
  # ----------------------------------------------------------
  multiscale:
    enabled: true

    tau_distribution:
      type: logspace
      min: 0.5
      max: 2.5
      n: 12

    coupling:
      enabled: false
      type: none

  # ----------------------------------------------------------
  # INFORMATION THEORY
  # ----------------------------------------------------------
  information:
    enabled: true

    entropy:
      type: shannon
      base: e

    agencity_index:
      enabled: true
      normalize: true

    landauer:
      enabled: false
      temperature: 300

  # ----------------------------------------------------------
  # PHYSICAL INTERPRETATION
  # ----------------------------------------------------------
  physics:
    energy_model:
      type: b_squared     # ∫ |b|²

    power_model:
      type: rms

    units:
      system: dimensionless
      agencity_unit: nat

  # ----------------------------------------------------------
  # CRITERIA (THEORETICAL VALIDATION)
  # ----------------------------------------------------------
  criteria:
    beta_threshold: 0.01
    contrast_positive: false
    orientation_stable: true

    theta_std_max: 1.0

  # ----------------------------------------------------------
  # EXPERIMENTAL FEATURES
  # ----------------------------------------------------------
  experimental:
    nonlinear_beta: false
    stochastic_noise: false
    quantum_extension: false