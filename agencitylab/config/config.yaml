# ============================================================
# AGENCITYLAB UNIVERSAL CONFIG
# ============================================================

mode: canonical   # canonical | experimental | fast | debug

# ============================================================
# BACKEND & PERFORMANCE
# ============================================================

backend:
  name: auto        # auto | numpy | numba | jax
  prefer_gpu: true
  fallback: numpy

performance:
  parallel: true
  chunk_size: 1024
  use_numba: false
  use_jax: false

# ============================================================
# NORMALIZATION
# ============================================================

normalization:
  method: zscore      # zscore | minmax | A_ref
  center: true
  epsilon: 1e-12

# ============================================================
# DYNAMICS (THEORY CORE)
# ============================================================

dynamics:
  tau:
    auto: true
    threshold: 0.5
    min: 1e-6

  activity_window: 1
  crm_window: 1

  reduced_time:
    enabled: true
    step: 1.0

# ============================================================
# POWER MODEL
# ============================================================

power:
  method: rms         # rms | variance | amplitude | explicit
  value: null
  normalize: true

# ============================================================
# FIELD (VECTOR AGENCITY)
# ============================================================

field:
  enabled: true
  components:
    bx: true
    by: true
    magnitude: true
    angle: true

  angle:
    unwrap: true
    degrees: false

# ============================================================
# CRITERIA (AGENCITY CONDITIONS)
# ============================================================

criteria:
  beta_min: 0.01
  J_min: 0.0
  theta_std_max: 1.0

# ============================================================
# MULTISCALE
# ============================================================

multiscale:
  enabled: true
  scales:
    min: 0.5
    max: 2.5
    n: 12
  log_scale: true

# ============================================================
# SIGNATURE (SCALING LAW)
# ============================================================

signature:
  enabled: true
  log_base: e

# ============================================================
# INFORMATION THEORY
# ============================================================

information:
  shannon:
    enabled: true
    bins: 50

  landauer:
    enabled: false
    temperature: 300

  agencity_index:
    enabled: true

# ============================================================
# EVENTS & ANOMALIES
# ============================================================

events:
  threshold: 3.0
  derivative_threshold: 2.0

anomalies:
  zscore_threshold: 4.0

# ============================================================
# SPECTRUM
# ============================================================

spectrum:
  detrend: true
  window: hann

# ============================================================
# OUTPUT
# ============================================================

output:
  store_full_fields: true
  complex_mode: true
  export:
    json: true
    csv: false
    excel: false

# ============================================================
# METADATA
# ============================================================

metadata:
  author: ""
  project: ""
  description: ""