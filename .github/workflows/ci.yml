name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify package import and version
        run: |
          python - <<'PY'
          import agencitylab
          assert agencitylab.__version__ == "0.9.0"
          print(agencitylab.__version__)
          PY

      - name: Ruff
        run: ruff check agencitylab tests benchmarks/performance examples

      - name: Pytest
        run: pytest

  package:
    name: Package / wheel, sdist, clean install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Clean wheel install and minimal compute
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/python -m pip check
          cd /tmp
          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import numpy as np
          import agencitylab

          assert agencitylab.__version__ == "0.9.0"
          requirements = metadata.requires("agencitylab") or []
          assert any(requirement.lower().startswith("numpy") for requirement in requirements)
          for optional in ("scipy", "pandas", "matplotlib", "numba", "jax"):
              assert importlib.util.find_spec(optional) is None, optional

          xi = np.arange(256, dtype=float)
          result = agencitylab.compute_agencity(
              u=np.sin(0.07 * xi),
              xi=xi,
              A_ref=1.0,
              tau=16.0,
              w=12.0,
              P_c=2.0,
          )
          analysis = agencitylab.analyze_agencity(result)
          assert result.b.shape == xi.shape
          assert np.all(np.isfinite(result.b))
          assert result.metadata.agencitylab_version == "0.9.0"
          assert analysis["events"]["dynamic_peaks"]["count"] >= 0
          print("minimal wheel install and analysis: PASS")
          PY

      - name: Clean sdist install and minimal compute
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install --upgrade pip
          .venv-sdist/bin/python -m pip install dist/*.tar.gz
          .venv-sdist/bin/python -m pip check
          cd /tmp
          "$GITHUB_WORKSPACE/.venv-sdist/bin/python" - <<'PY'
          import numpy as np
          import agencitylab
          assert agencitylab.__version__ == "0.9.0"
          assert agencitylab.available_backends() == ("numpy",)
          xi = np.arange(64, dtype=float)
          result = agencitylab.compute_agencity(
              u=np.sin(0.2 * xi),
              xi=xi,
              A_ref=1.0,
              tau=4.0,
              w=3.0,
              P_c=1.0,
          )
          assert result.b.shape == xi.shape
          print("minimal sdist install and compute: PASS")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: agencitylab-0.9.0-distributions
          path: dist/
          if-no-files-found: error

  optional-extras:
    name: Extra / ${{ matrix.extra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [scientific, data, viz, export, numba, jax]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install isolated extra
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[${EXTRA}]"
          python -m pip check

      - name: Smoke test isolated extra
        env:
          EXTRA: ${{ matrix.extra }}
        run: python tests/packaging/smoke_extra.py "${EXTRA}"

  docs:
    name: Docs / Sphinx warnings as errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  examples:
    name: Examples / critical user workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documented example capabilities
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[viz,export]"
          python -m pip check

      - name: Run minimal example
        env:
          MPLBACKEND: Agg
        run: python examples/basic/simple_compute.py

      - name: Run scientific workflow example
        env:
          MPLBACKEND: Agg
        run: |
          python examples/basic/scientific_workflow.py
          test -d agencity_output
          rm -rf agencity_output

      - name: Run multiscale example
        run: python examples/advanced/agencity_spectrum.py

  benchmark:
    name: Benchmark / reproducible scientific equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install NumPy-only benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run retained v0.8 before-after benchmark
        run: |
          python benchmarks/performance/benchmark_v08.py \
            --quick \
            --output benchmark-v08.json

      - name: Verify numerical equivalence, not timing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("benchmark-v08.json").read_text(encoding="utf-8"))
          for group in ("crm", "pipeline", "sigma_theta"):
              for row in report[group]:
                  assert row["max_abs_difference"] <= 1e-8, (group, row)
          assert all(row["finite_domain_equal"] for row in report["sigma_theta"])
          workloads = report["representative_workloads"]
          assert workloads["stream_final_max_abs_difference"] == 0.0
          assert workloads["batch_threaded_max_abs_difference"] == 0.0
          print("benchmark scientific equivalence: PASS")
          PY

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: agencitylab-v0.9-retained-v08-benchmark
          path: benchmark-v08.json
          if-no-files-found: error
