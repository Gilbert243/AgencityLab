name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundations:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viz]"

      - name: Verify package import and version
        run: python -c "import agencitylab; print(agencitylab.__version__)"

      - name: Ruff
        run: ruff check agencitylab tests

      - name: Pytest
        run: pytest

      - name: Build distributions
        run: python -m build
