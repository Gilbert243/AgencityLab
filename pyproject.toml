[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "agencitylab"
version = "0.5.0"
description = "Scientific framework for the theory of Agencity"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Gilbert BEMWIZ", email = "bemwizigilbert@gmail.com" }
]

keywords = [
  "agencity",
  "complex systems",
  "information physics",
  "dynamical systems",
  "signal processing",
  "scientific computing"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "numpy>=1.22",
  "scipy>=1.9",
  "pandas>=1.5",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.6",
  "seaborn>=0.12",
  "plotly>=5.0",
]
app = [
  "streamlit>=1.25",
]
ml = [
  "jax>=0.4",
  "jaxlib>=0.4",
  "numba>=0.57",
]
export = [
  "openpyxl>=3.1",
  "reportlab>=4.0",
]
docs = [
  "sphinx>=7.0",
  "myst-parser>=2.0",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "black",
  "ruff",
  "build>=1.2",
]
all = [
  "matplotlib>=3.6",
  "seaborn>=0.12",
  "plotly>=5.0",
  "streamlit>=1.25",
  "jax>=0.4",
  "jaxlib>=0.4",
  "numba>=0.57",
  "openpyxl>=3.1",
  "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/Gilbert243/AgencityLab"
Documentation = "https://agencitylab.readthedocs.io"
Source = "https://github.com/Gilbert243/AgencityLab"
Issues = "https://github.com/Gilbert243/AgencityLab/issues"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Correctness-focused baseline; scientific variables such as O remain canonical names.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
