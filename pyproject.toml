[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "agencitylab"
version = "1.1.7"
description = "Scientific framework for the theory of Agencity"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Gilbert BEMWIZ", email = "bemwizigilbert@gmail.com" }
]

keywords = [
  "agencity",
  "complex systems",
  "information physics",
  "dynamical systems",
  "signal processing",
  "scientific computing"
]

classifiers = [
  # This classifier describes the stable software contract, not empirical
  # validation of experimental, research, or speculative scientific layers.
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

# The canonical engine and stable public API require only NumPy. Heavier
# scientific, tabular, visualization, export, and acceleration dependencies are
# deliberately isolated below so a clean core install remains small and honest.
dependencies = [
  "numpy>=1.22",
]

[project.optional-dependencies]
scientific = [
  "scipy>=1.9",
]
data = [
  "pandas>=1.5",
  "xarray>=2023.1",
]
viz = [
  "matplotlib>=3.6",
]
numba = [
  "numba>=0.57",
]
jax = [
  "jax>=0.4",
  "jaxlib>=0.4",
]
# Compatibility extra retained for pre-v0.8 environments. New installations
# should prefer the narrower ``numba`` or ``jax`` extras.
ml = [
  "jax>=0.4",
  "jaxlib>=0.4",
  "numba>=0.57",
]
export = [
  "pandas>=1.5",
  "openpyxl>=3.1",
  "reportlab>=4.0",
]
docs = [
  "sphinx>=7.0",
  "myst-parser>=2.0",
]
# ``dev`` is intentionally the complete dependency set required by the full
# repository test suite. Runtime users should install the narrower extras above.
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "scipy>=1.9",
  "pandas>=1.5",
  "xarray>=2023.1",
  "matplotlib>=3.6",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "black",
  "ruff",
  "build>=1.2",
]
all = [
  "scipy>=1.9",
  "pandas>=1.5",
  "xarray>=2023.1",
  "matplotlib>=3.6",
  "jax>=0.4",
  "jaxlib>=0.4",
  "numba>=0.57",
  "openpyxl>=3.1",
  "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/somafgroup/AgencityLab"
Documentation = "https://agencitylab.readthedocs.io"
Source = "https://github.com/somafgroup/AgencityLab"
Issues = "https://github.com/somafgroup/AgencityLab/issues"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Correctness-focused baseline; scientific variables such as O remain canonical names.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
